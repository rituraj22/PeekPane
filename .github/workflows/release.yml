name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.1)"
        required: true
        default: "1.1"

permissions:
  contents: write

jobs:
  release:
    name: Package & Publish macOS Release
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: meta
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Package Universal Release (.zip, .dmg, SHA256SUMS.txt)
        run: ./scripts/package_release.sh "${{ steps.meta.outputs.version }}"

      - name: Upload GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: PeekPane v${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: |
            dist/PeekPane-${{ steps.meta.outputs.version }}-macos.zip
            dist/PeekPane-${{ steps.meta.outputs.version }}-macos.dmg
            dist/SHA256SUMS.txt
            Casks/peekpane.rb
