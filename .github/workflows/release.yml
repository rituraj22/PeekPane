name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.1)"
        required: true
        default: "1.2.1"

permissions:
  contents: write

jobs:
  release:
    name: Package & Publish macOS Release
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Determine version
        id: meta
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Package Universal Release (.zip, .dmg, SHA256SUMS.txt)
        run: ./scripts/package_release.sh "${{ steps.meta.outputs.version }}"

      - name: Upload GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: PeekPane v${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: |
            dist/PeekPane-${{ steps.meta.outputs.version }}-macos.zip
            dist/PeekPane-${{ steps.meta.outputs.version }}-macos.dmg
            dist/SHA256SUMS.txt
            Casks/peekpane.rb

      - name: Sync Homebrew Cask SHA-256 to main
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          ZIP_SHA256="$(shasum -a 256 "dist/PeekPane-${VERSION}-macos.zip" | awk '{print $1}')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          sed -i '' -E "s/version \"[^\"]+\"/version \"${VERSION}\"/" Casks/peekpane.rb
          sed -i '' -E "s/sha256 \"[^\"]+\"/sha256 \"${ZIP_SHA256}\"/" Casks/peekpane.rb
          if ! git diff --quiet Casks/peekpane.rb; then
            git add Casks/peekpane.rb
            git commit -m "chore(cask): update peekpane.rb SHA-256 for v${VERSION} [skip ci]"
            git push origin HEAD:main
          fi
